dependencies {
    api project(':vexra-proto')
    api project(':vexra-common')
    api project(':vexra-client')
    api project(':vexra-server')
    api project(':vexra-grpc')


    //api 'com.zaxxer:HikariCP:4.0.3'
    api("jline:jline:2.14.6")
    api("net.xdob.vexra:vexra-ldb:${ldb_version}")
    api("net.xdob.h2db:h2db:${h2db_version}")
    implementation 'org.osgi:org.osgi.core:5.0.0'
    implementation 'org.locationtech.jts:jts-core:1.17.0'
    implementation 'javax.servlet:javax.servlet-api:4.0.1'
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'
    compileOnly 'org.apache.lucene:lucene-core:8.5.2'
    compileOnly 'org.apache.lucene:lucene-analyzers-common:8.5.2'
    compileOnly 'org.apache.lucene:lucene-queryparser:8.5.2'
    compileOnly "ch.qos.logback:logback-core:${logback_version}"
    compileOnly "ch.qos.logback:logback-classic:${logback_version}"
    compileOnly("org.rocksdb:rocksdbjni:9.1.0")
    implementation("org.lz4:lz4-java:1.8.0")
    //testImplementation 'org.testng:testng:7.1.0'
    compileOnly 'org.osgi:org.osgi.service.jdbc:1.1.0'
}

test {
    useJUnitPlatform()
}

def adbRuntimeClasspath = files(tasks.named('jar')) + configurations.runtimeClasspath

tasks.register('adbSqlServerStartScripts', org.gradle.jvm.application.tasks.CreateStartScripts) {
    dependsOn tasks.named('jar')
    applicationName = 'adb-sql-server'
    mainClassName = 'net.xdob.vexra.adb.AdbSqlServerMain'
    classpath = adbRuntimeClasspath
    outputDir = layout.buildDirectory.dir('adb-runtime/scripts/sql').get().asFile
    optsEnvironmentVar = 'ADB_SQL_SERVER_OPTS'
    exitEnvironmentVar = 'ADB_SQL_SERVER_EXIT_CONSOLE'
}

tasks.register('adbRegionNodeStartScripts', org.gradle.jvm.application.tasks.CreateStartScripts) {
    dependsOn tasks.named('jar')
    applicationName = 'adb-region-node'
    mainClassName = 'net.xdob.vexra.adb.ha2.AdbRegionNodeMain'
    classpath = adbRuntimeClasspath
    outputDir = layout.buildDirectory.dir('adb-runtime/scripts/region').get().asFile
    optsEnvironmentVar = 'ADB_REGION_NODE_OPTS'
    exitEnvironmentVar = 'ADB_REGION_NODE_EXIT_CONSOLE'
}

tasks.register('adbClusterPlanStartScripts', org.gradle.jvm.application.tasks.CreateStartScripts) {
    dependsOn tasks.named('jar')
    applicationName = 'adb-cluster-plan'
    mainClassName = 'net.xdob.vexra.adb.AdbClusterPlanMain'
    classpath = adbRuntimeClasspath
    outputDir = layout.buildDirectory.dir('adb-runtime/scripts/cluster').get().asFile
    optsEnvironmentVar = 'ADB_CLUSTER_PLAN_OPTS'
    exitEnvironmentVar = 'ADB_CLUSTER_PLAN_EXIT_CONSOLE'
}

tasks.register('adbClusterPreflightStartScripts', org.gradle.jvm.application.tasks.CreateStartScripts) {
    dependsOn tasks.named('jar')
    applicationName = 'adb-cluster-preflight'
    mainClassName = 'net.xdob.vexra.adb.AdbClusterPreflightMain'
    classpath = adbRuntimeClasspath
    outputDir = layout.buildDirectory.dir('adb-runtime/scripts/preflight').get().asFile
    optsEnvironmentVar = 'ADB_CLUSTER_PREFLIGHT_OPTS'
    exitEnvironmentVar = 'ADB_CLUSTER_PREFLIGHT_EXIT_CONSOLE'
}

tasks.register('adbReleaseProfileStartScripts', org.gradle.jvm.application.tasks.CreateStartScripts) {
    dependsOn tasks.named('jar')
    applicationName = 'adb-release-profile'
    mainClassName = 'net.xdob.vexra.adb.AdbReleaseProfileMain'
    classpath = adbRuntimeClasspath
    outputDir = layout.buildDirectory.dir('adb-runtime/scripts/release').get().asFile
    optsEnvironmentVar = 'ADB_RELEASE_PROFILE_OPTS'
    exitEnvironmentVar = 'ADB_RELEASE_PROFILE_EXIT_CONSOLE'
}

tasks.register('adbReleaseProfile', JavaExec) {
    dependsOn tasks.named('classes')
    group = 'verification'
    description = 'Runs the ADB GA release profile gate and writes release evidence.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.xdob.vexra.adb.AdbReleaseProfileMain'
    def releaseId = findProperty('adbReleaseId') ?: "local-${project.version}"
    def output = findProperty('adbReleaseOutput') ?:
        layout.buildDirectory.dir("adb-release-evidence/${releaseId}").get().asFile.absolutePath
    args '--releaseId', releaseId.toString(),
        '--version', project.version.toString(),
        '--output', output.toString(),
        '--commands', (findProperty('adbReleaseCommands') ?: '.\\gradlew.bat :vexra-adb:test').toString(),
        '--checksums', (findProperty('adbReleaseChecksums') ?: 'none=not-provided').toString()
}

tasks.register('adbRuntimeDist', Zip) {
    dependsOn tasks.named('jar'), tasks.named('adbSqlServerStartScripts'),
        tasks.named('adbRegionNodeStartScripts'),
        tasks.named('adbClusterPlanStartScripts'),
        tasks.named('adbClusterPreflightStartScripts'),
        tasks.named('adbReleaseProfileStartScripts')
    archiveClassifier = 'runtime'

    into('lib') {
        from(tasks.named('jar'))
        from(configurations.runtimeClasspath)
    }
    into('bin') {
        from(tasks.named('adbSqlServerStartScripts'))
        from(tasks.named('adbRegionNodeStartScripts'))
        from(tasks.named('adbClusterPlanStartScripts'))
        from(tasks.named('adbClusterPreflightStartScripts'))
        from(tasks.named('adbReleaseProfileStartScripts'))
        fileMode = 0755
    }
}

tasks.named('test') {
    dependsOn tasks.named('adbRuntimeDist')
}
