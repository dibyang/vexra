
dependencies {
    api project(':vexra-proto')
    api project(':vexra-common')
    api project(':vexra-client')
    api project(':vexra-server-api')
    api project(':vexra-metrics-api')
    api project(':vexra-metrics-default')
    implementation "io.grpc:grpc-netty:${grpc_version}" // 或 grpc-okhttp，根据需要选择传输层实现
    implementation("io.grpc:grpc-protobuf:${grpc_version}"){
      exclude group: 'io.grpc', module: 'grpc-protobuf-lite'
    }
    implementation("io.grpc:grpc-protobuf-lite:${grpc_version}"){
      exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }
    implementation "io.grpc:grpc-stub:${grpc_version}"
    implementation project(':vexra-server')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}